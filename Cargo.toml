[workspace]
resolver = "2"
members = ["crates/aiops-core", "apps/aiops-runner", "apps/aiopsd"]
# The experiment target is built on its own (inside the runner), never as part of this workspace.
exclude = ["fixtures/orders-api"]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
similar = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "v7"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
aiops-core = { path = "crates/aiops-core" }
