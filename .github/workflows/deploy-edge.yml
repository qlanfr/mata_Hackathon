name: Deploy edge

# Runs on demand or when a push changes .github/deploy-request. Applies the D1 migrations,
# builds both container images (Docker is available on GitHub runners), deploys the Worker, sets its secrets
# and, unless turned off, drives one full run on the deployed URL with scripts/drive-run.sh.
#
# Repository secrets: CLOUDFLARE_API_TOKEN and ADMIN_TOKEN (16+ characters). CLOUDFLARE_ACCOUNT_ID
# is only needed when the token can access more than one account. META_API_KEY is optional.
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run one full run on the deployed Worker after deploying
        type: boolean
        default: true
  # A push that changes .github/deploy-request also deploys (with the full run). This lets
  # automation that can push to the branch but cannot dispatch workflows start a deploy.
  push:
    paths:
      - .github/deploy-request

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: edge
    # CLOUDFLARE_ACCOUNT_ID is not set here: the "Resolve the Cloudflare account" step checks the
    # secret against the token and exports the account ID for the later steps.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      META_API_KEY: ${{ secrets.META_API_KEY }}
      D1_DATABASE_ID: 40be013f-ab7b-40eb-889a-40454179225f
    steps:
      - uses: actions/checkout@v4

      - name: Check repository secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          if [ -n "$ADMIN_TOKEN" ] && [ "${#ADMIN_TOKEN}" -lt 16 ]; then
            echo "::error::ADMIN_TOKEN must be at least 16 characters"; missing=1
          fi
          exit $missing

      # Uses the CLOUDFLARE_ACCOUNT_ID secret when it is an account the token can access. If it is
      # missing or wrong and the token belongs to exactly one account, uses that account. Then
      # checks that the token can reach the D1 database, so a permission problem shows up here.
      - name: Resolve the Cloudflare account
        env:
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          accounts=$(api "accounts?per_page=50")
          if [ "$(jq -r '.success' <<< "$accounts")" != true ]; then
            echo "::error::The token cannot list its accounts: $(jq -c '.errors' <<< "$accounts")"
            exit 1
          fi
          ids=$(jq -r '.result[].id' <<< "$accounts")
          for id in $ids; do echo "::add-mask::$id"; done
          count=$(grep -c . <<< "$ids" || true)
          given=$(tr -d '[:space:]' <<< "$ACCOUNT_ID_SECRET")
          if [ -n "$given" ] && grep -qx "$given" <<< "$ids"; then
            account=$given
          elif [ "$count" = 1 ]; then
            account=$ids
            if [ -n "$given" ]; then
              echo "::warning::The CLOUDFLARE_ACCOUNT_ID secret is not an account this token can access. Using the token's own account instead."
            fi
          else
            echo "::error::Cannot pick an account: the token can access $count accounts and CLOUDFLARE_ACCOUNT_ID does not match any of them."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account" >> "$GITHUB_ENV"
          d1=$(api "accounts/$account/d1/database/$D1_DATABASE_ID")
          if [ "$(jq -r '.success' <<< "$d1")" != true ]; then
            echo "::error::The token cannot read the D1 database aiops-control: $(jq -c '.errors' <<< "$d1"). Add Account · D1 · Edit to the token."
            exit 1
          fi
          echo "account resolved; D1 database $(jq -r '.result.name' <<< "$d1") is reachable"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            web/package-lock.json
      - run: npm ci
      # Informational: account-owned tokens may not read user details. A token that cannot
      # deploy fails at the migration step right after.
      - name: Check the API token
        run: npx wrangler whoami || echo "::warning::wrangler whoami failed; continuing"
      - run: npx wrangler types && npx tsc --noEmit
      - run: npm run build:web
      - run: npx wrangler d1 migrations apply aiops-control --remote

      - name: Deploy
        id: deploy
        run: |
          mkdir -p ../.work
          # Secrets go up with the new version, so a container never starts without them.
          secrets="$RUNNER_TEMP/worker-secrets.json"
          (umask 077 && python3 - "$secrets" <<'PY'
          import json, os, sys
          s = {"ADMIN_TOKEN": os.environ["ADMIN_TOKEN"]}
          if os.environ.get("META_API_KEY"):
              s["META_API_KEY"] = os.environ["META_API_KEY"]
          json.dump(s, open(sys.argv[1], "w"))
          PY
          )
          status=0
          npx wrangler deploy --secrets-file "$secrets" 2>&1 | tee ../.work/deploy.log || status=$?
          rm -f "$secrets"
          [ "$status" = 0 ] || exit "$status"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' ../.work/deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL: ${url:-not found in the wrangler output}" >> "$GITHUB_STEP_SUMMARY"
          # What the full run should look like: a real model may legitimately finish without a
          # verified change, so it only has to finish; replay must reach VERIFIED.
          model=$(python3 -c 'import re,sys; m=re.search(r"\"META_MODEL\":\s*\"([^\"]*)\"", open("wrangler.jsonc").read()); print(m.group(1) if m else "")')
          if [ -n "$model" ] && [ -n "$META_API_KEY" ]; then
            echo "provider=meta:$model" >> "$GITHUB_OUTPUT"; echo "accept=finished" >> "$GITHUB_OUTPUT"
          else
            echo "provider=replay" >> "$GITHUB_OUTPUT"; echo "accept=verified" >> "$GITHUB_OUTPUT"
          fi

      - name: Full run on Cloudflare
        if: (github.event_name == 'push' || inputs.run_e2e) && steps.deploy.outputs.url != ''
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECT_PROVIDER: ${{ steps.deploy.outputs.provider }}
          ACCEPT: ${{ steps.deploy.outputs.accept }}
          OUT: ${{ github.workspace }}/.work/cf-e2e
          STARTUP_S: "900"
          TIMEOUT_S: "3000"
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$BASE_URL/healthz"; echo
          ../scripts/drive-run.sh

      - name: Container status
        if: always() && steps.deploy.outcome != 'skipped'
        run: npx wrangler containers list || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-edge
          path: .work
          if-no-files-found: ignore
          # .work starts with a dot, and upload-artifact skips hidden paths by default.
          include-hidden-files: true
