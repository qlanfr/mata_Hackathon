name: Deploy edge

# Manual only. Applies the D1 migrations, builds both container images (Docker is available on
# GitHub runners), deploys the Worker, sets its secrets and, unless turned off, drives one full
# run on the deployed URL with scripts/drive-run.sh.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN (16+ characters),
# and optionally META_API_KEY.
on:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run one full run on the deployed Worker after deploying
        type: boolean
        default: true

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: edge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      META_API_KEY: ${{ secrets.META_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check repository secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; missing=1; fi
          done
          if [ -n "$ADMIN_TOKEN" ] && [ "${#ADMIN_TOKEN}" -lt 16 ]; then
            echo "::error::ADMIN_TOKEN must be at least 16 characters"; missing=1
          fi
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            edge/package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Check the API token
        run: npx wrangler whoami
      - run: npx wrangler types && npx tsc --noEmit
      - run: npm run build:web
      - run: npx wrangler d1 migrations apply aiops-control --remote

      - name: Deploy
        id: deploy
        run: |
          mkdir -p ../.work
          npx wrangler deploy 2>&1 | tee ../.work/deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' ../.work/deploy.log | head -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Worker URL: ${url:-not found in the wrangler output}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set Worker secrets
        run: |
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          if [ -n "$META_API_KEY" ]; then printf '%s' "$META_API_KEY" | npx wrangler secret put META_API_KEY; fi

      - name: Full run on Cloudflare
        if: inputs.run_e2e && steps.deploy.outputs.url != ''
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          OUT: ${{ github.workspace }}/.work/cf-e2e
          STARTUP_S: "900"
          TIMEOUT_S: "3000"
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$BASE_URL/healthz"; echo
          ../scripts/drive-run.sh

      - name: Container status
        if: always() && steps.deploy.outcome != 'skipped'
        run: npx wrangler containers list || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-edge
          path: .work
          if-no-files-found: ignore
