name: Deploy edge

# Manual only: applies D1 migrations, builds both container images (Docker is available on
# GitHub runners) and deploys the Worker. Repository secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID, ADMIN_TOKEN, and optionally META_API_KEY.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: edge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci
      - run: npx wrangler types && npx tsc --noEmit
      - run: npx wrangler d1 migrations apply aiops-control --remote
      - run: npx wrangler deploy
      - name: Set secrets
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then echo "ADMIN_TOKEN secret is missing" >&2; exit 1; fi
          printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          if [ -n "$META_API_KEY" ]; then printf '%s' "$META_API_KEY" | npx wrangler secret put META_API_KEY; fi
