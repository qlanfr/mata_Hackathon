name: Vulnerability fix run

# Runs the whole loop with a Meta model on the vulnerability-fix scenario (scenarios/sqli-search:
# SQL injection in product search). aiopsd, aiops-runner and PostgreSQL run as local processes on
# this GitHub-hosted runner; the Cloudflare deployment is not touched. The verdict needs every
# reported and held-out attack blocked and every golden response unchanged. If a fix is VERIFIED,
# `aiops apply` prepares it as a pull request description (not opened).
# Runs on demand or when a push changes .github/security-run-request; the last non-comment line of
# that file lists the Meta models to use, one run each, in order (a model may repeat).
# Repository secret: META_API_KEY.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/security-run-request

concurrency:
  group: security-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIOPS_REPO_ROOT: ${{ github.workspace }}
      AIOPS_SCENARIO: scenarios/sqli-search/scenario.toml
      AIOPS_WORK_DIR: ${{ github.workspace }}/.work/runner
      AIOPS_TARGET_DIR: ${{ github.workspace }}/.work/target
      AIOPS_K6: /usr/local/bin/k6
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$META_API_KEY" ]; then echo "::error::Repository secret META_API_KEY is not set"; exit 1; fi
      - name: Tools (PostgreSQL server, k6)
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          test -x "$bin/postgres" && echo "AIOPS_PG_BIN=$bin" >> "$GITHUB_ENV"
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Build aiops-runner, aiopsd and aiops
        run: cargo build -q --release --locked -p aiops-runner -p aiopsd -p aiops-cli
      - name: Start the runner and aiopsd
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          models=$(grep -v '^\s*#' .github/security-run-request | grep -v '^\s*$' | tail -1)
          models=${models:-muse-spark-1.3}
          echo "MODELS=$models" >> "$GITHUB_ENV"
          mkdir -p .work
          nohup ./target/release/aiops-runner serve --listen 127.0.0.1:18080 > .work/runner.log 2>&1 &
          META_MODEL="${models%% *}" AIOPS_DB=sqlite:.work/control.db AIOPS_ARTIFACTS=fs:.work/artifacts \
            nohup ./target/release/aiopsd --listen 127.0.0.1:18090 --runner-url http://127.0.0.1:18080 > .work/aiopsd.log 2>&1 &
          for _ in $(seq 60); do curl -fsS 127.0.0.1:18090/api/v1/info && break; sleep 2; done; echo
      - name: Run the loop, once per model
        env:
          AIOPS_URL: http://127.0.0.1:18090
        run: |
          provider=$(./target/release/aiops --json info | python3 -c 'import json,sys; print(json.load(sys.stdin)["provider"])')
          case "$provider" in meta:*) ;; *) echo "::error::provider is $provider, expected a Meta model"; exit 1 ;; esac
          : > .work/runs.txt
          for model in $MODELS; do
            echo "== $model"
            ./target/release/aiops run --model "$model" --wait --timeout-s 2400 2>&1 | tee .work/run.txt || true
            run_id=$(grep -oE 'run [0-9a-f-]{36}' .work/run.txt | head -1 | cut -d' ' -f2)
            [ -n "$run_id" ] && echo "$run_id $model" >> .work/runs.txt
            { echo "### $model"; echo '```'; ./target/release/aiops status "$run_id"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          cat .work/runs.txt
      - name: Trials and pull request descriptions
        if: always()
        env:
          AIOPS_URL: http://127.0.0.1:18090
        run: |
          while read -r run_id model; do
            ./target/release/aiops --json status "$run_id" > ".work/status-$run_id.json"
            for t in $(python3 -c 'import json,sys; print(" ".join(t["trial_id"] for t in json.load(open(sys.argv[1]))["trials"]))' ".work/status-$run_id.json"); do
              { echo; echo "### $model · trial $t"; echo '```'; ./target/release/aiops trial "$t" --diff; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
              if [ "$(./target/release/aiops --json trial "$t" | python3 -c 'import json,sys; print(json.load(sys.stdin)["outcome"])')" = VERIFIED ]; then
                ./target/release/aiops apply "$t" --body-file ".work/pr-body-$t.md"
                { echo; echo "#### Pull request description (not opened)"; cat ".work/pr-body-$t.md"; } >> "$GITHUB_STEP_SUMMARY"
                git diff > ".work/verified-$t.patch"
                git checkout -- fixtures
              fi
            done
          done < .work/runs.txt
      - name: Logs
        if: always()
        run: |
          tail -40 .work/aiopsd.log || true
          tail -40 .work/runner.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-run
          path: |
            .work/*.txt
            .work/*.json
            .work/*.md
            .work/*.patch
            .work/control.db
            .work/artifacts
            .work/*.log
          if-no-files-found: ignore
          include-hidden-files: true
