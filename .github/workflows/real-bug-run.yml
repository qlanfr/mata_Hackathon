name: Real bug run

# Runs the whole loop (Meta model, runner, evaluator) on a real bug: Vaultwarden issue #1402, the
# N+1 on GET /api/sync (scenarios/vaultwarden-sync). Everything runs on this GitHub-hosted runner:
# aiopsd, aiops-runner and PostgreSQL as local processes, not in the Cloudflare containers, and the
# deployed demo is not touched. Runs on demand or when a push changes .github/real-bug-run-request;
# the last non-comment line of that file is the Meta model to use.
# Repository secret: META_API_KEY.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/real-bug-run-request

concurrency:
  group: real-bug-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      AIOPS_REPO_ROOT: ${{ github.workspace }}
      AIOPS_SCENARIO: scenarios/vaultwarden-sync/scenario.toml
      AIOPS_WORK_DIR: ${{ github.workspace }}/.work/runner
      AIOPS_TARGET_DIR: ${{ github.workspace }}/.work/target
      AIOPS_K6: /usr/local/bin/k6
      AIOPS_OFFLINE: "true"
      AIOPS_KEEP_WORKSPACES: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$META_API_KEY" ]; then echo "::error::Repository secret META_API_KEY is not set"; exit 1; fi
      - name: Tools (PostgreSQL server, libpq, k6, Rust 1.60)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libpq-dev > /dev/null
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          test -x "$bin/postgres" && echo "AIOPS_PG_BIN=$bin" >> "$GITHUB_ENV"
          "$bin/postgres" --version
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.57.0/k6-v0.57.0-linux-amd64.tar.gz | tar -xz -C /tmp
          sudo mv /tmp/k6-v0.57.0-linux-amd64/k6 /usr/local/bin/k6
          rustup toolchain install 1.60.0 --profile minimal
          rustc --version; rustc +1.60.0 --version
      - name: Build aiops-runner and aiopsd
        run: cargo build --release --locked -p aiops-runner -p aiopsd
      - name: Prepare Vaultwarden (clone, build, seed, dump)
        run: scripts/real-bug/vaultwarden-setup.sh
      - name: Record golden answers from the unchanged service
        run: ./target/release/aiops-runner golden
      - name: Start the runner and aiopsd
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          model=$(grep -v '^\s*#' .github/real-bug-run-request | grep -v '^\s*$' | tail -1)
          model=${model:-muse-spark-1.3}
          echo "META_MODEL=$model" >> "$GITHUB_ENV"
          mkdir -p .work
          nohup ./target/release/aiops-runner serve --listen 127.0.0.1:18080 > .work/runner.log 2>&1 &
          META_MODEL="$model" AIOPS_DB=sqlite:.work/control.db AIOPS_ARTIFACTS=fs:.work/artifacts \
            nohup ./target/release/aiopsd --listen 127.0.0.1:18090 --runner-url http://127.0.0.1:18080 > .work/aiopsd.log 2>&1 &
          for _ in $(seq 60); do curl -fsS 127.0.0.1:18090/api/v1/info && break; sleep 2; done; echo
      - name: Run the loop
        env:
          BASE_URL: http://127.0.0.1:18090
          ACCEPT: finished
          OUT: ${{ github.workspace }}/.work/drive
          STARTUP_S: "300"
          TIMEOUT_S: "6000"
          POLL_S: "20"
        run: |
          EXPECT_PROVIDER="meta:$META_MODEL" scripts/drive-run.sh
          cat "$OUT/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Trial details
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json
          for f in sorted(glob.glob(".work/drive/artifact-*.json")):
              a = json.load(open(f)); r = a.get("report") or a
              ev = r.get("evaluation") or {}
              def p95(side): 
                  v = [p[side]["p95_ms"] for p in r.get("pairs", [])]; return f"{sum(v)/len(v):.1f} ms" if v else "-"
              bl, cl = r.get("baseline_logs") or {}, r.get("candidate_logs") or {}
              print(f"\n### {f}\n- build: {(r.get('build') or {}).get('ok')} · golden {(r.get('correctness') or {}).get('passed')}/{(r.get('correctness') or {}).get('total')}")
              print(f"- p95 baseline {p95('baseline')} · candidate {p95('candidate')} · SQL/request {bl.get('avg_sql_count', 0):.1f} vs {cl.get('avg_sql_count', 0):.1f}")
              print(f"- patch error: {r.get('patch_error')} · execution error: {r.get('execution_error')}")
              print("```diff\n" + (r.get("diff") or "")[:6000] + "\n```")
          PY
      - name: Logs
        if: always()
        run: |
          tail -60 .work/aiopsd.log || true
          tail -60 .work/runner.log || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-bug-run
          path: |
            .work/drive
            .work/control.db
            .work/artifacts
            .work/*.log
            .work/runner/trials/*/build.log
            .work/runner/trials/*/*.log
            external/vaultwarden-cases
          if-no-files-found: ignore
          include-hidden-files: true
