name: Meta contract

# Checks the live Meta Model API against the request and response shapes aiopsd's MetaProvider
# uses (function tool round trip and a JSON-schema answer), with `aiopsd --contract-test`.
# Runs on demand or when a push changes .github/meta-contract-request, whose last non-comment
# line is the model ID to test. Repository secret: META_API_KEY.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/meta-contract-request

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$META_API_KEY" ]; then echo "::error::Repository secret META_API_KEY is not set"; exit 1; fi
      - name: Build aiopsd
        run: cargo build --release --locked -p aiopsd
      - name: Contract test
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          model=$(grep -v '^\s*#' .github/meta-contract-request | grep -v '^\s*$' | tail -1 | tr -d '[:space:]')
          echo "model: $model" | tee -a "$GITHUB_STEP_SUMMARY"
          ./target/release/aiopsd --contract-test --meta-model "$model" 2>&1 | tee contract.log
          tail -1 contract.log >> "$GITHUB_STEP_SUMMARY"
