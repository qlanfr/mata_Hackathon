name: Meta contract

# Checks the live Meta Model API against the request and response shapes aiopsd's MetaProvider
# uses (function tool round trip and a JSON-schema answer), with `aiopsd --contract-test`.
# Runs on demand or when a push changes .github/meta-contract-request; every non-comment line of
# that file is a model ID to test. Repository secret: META_API_KEY.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/meta-contract-request

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the secret
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          if [ -z "$META_API_KEY" ]; then echo "::error::Repository secret META_API_KEY is not set"; exit 1; fi
      - name: List the models this key can use
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          curl -sS -H "Authorization: Bearer $META_API_KEY" https://api.meta.ai/v1/models \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(m.get("id"), m.get("owned_by", "")) for m in d.get("data", [])] if isinstance(d, dict) and "data" in d else print(json.dumps(d)[:500])' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Build aiopsd
        run: cargo build --release --locked -p aiopsd
      - name: Contract test
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          failed=0
          for model in $(grep -v '^\s*#' .github/meta-contract-request | grep -v '^\s*$'); do
            echo "::group::$model"
            if ./target/release/aiopsd --contract-test --meta-model "$model" > "contract-$model.log" 2>&1; then
              result=PASS
            else
              result=FAIL; failed=1
            fi
            cat "contract-$model.log"
            echo "::endgroup::"
            echo "$result $model: $(grep -m1 -E '^(Error:|contract test passed)' "contract-$model.log")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit $failed
