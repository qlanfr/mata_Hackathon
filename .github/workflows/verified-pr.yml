name: PR from a verified run

# Turns a VERIFIED run on the deployment into a pull request that carries the measured evidence.
#
# 1. Picks the run: the `run_id` input, the last line of .github/pr-request on a push, or, on the
#    nightly schedule, the run the deployment started at its scheduled time today.
# 2. `aiops apply` puts the verified patch into this checkout with the harness's own path policy
#    and security gate, after checking it is the exact patch that was measured.
# 3. Builds the patched service, then (only if asked) pushes branch aiops/verified-<run> and opens
#    a pull request against the branch this workflow ran on.
#
# A pull request is opened only when the `open_pr` input is true, or on the schedule when the
# repository variable AIOPS_AUTO_PR is `true`. Otherwise this is a dry run: the diff and the
# description are uploaded as an artifact and shown in the job summary. Opening a pull request with
# the workflow token needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings; without it the branch is still pushed and a compare link printed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run ID on the deployment, or `latest` for the newest VERIFIED run
        default: latest
      open_pr:
        description: Push a branch and open a pull request (otherwise a dry run)
        type: boolean
        default: false
  push:
    paths:
      - .github/pr-request
  # 19:47 UTC, after the deployment's scheduled run at 17:00 UTC has had time to finish, including
  # its retries on a noisy machine.
  schedule:
    - cron: "47 19 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: verified-pr
  cancel-in-progress: false

env:
  AIOPS_URL: https://aiops-edge.yh9365.workers.dev

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build aiops
        run: cargo build -q --release --locked -p aiops-cli

      - name: Pick the run
        id: pick
        env:
          INPUT_RUN: ${{ inputs.run_id }}
          INPUT_OPEN: ${{ inputs.open_pr }}
          AUTO_PR: ${{ vars.AIOPS_AUTO_PR }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) which="${INPUT_RUN:-latest}"; open="$INPUT_OPEN" ;;
            schedule) which=scheduled; open=$([ "$AUTO_PR" = true ] && echo true || echo false) ;;
            *) which=$(grep -v '^\s*#' .github/pr-request | grep -v '^\s*$' | tail -1); open=false ;;
          esac
          for _ in $(seq 30); do ./target/release/aiops info >/dev/null && break; sleep 10; done
          picked=$(python3 scripts/pick-verified.py ./target/release/aiops "$which")
          if [ -z "$picked" ]; then
            echo "No VERIFIED run for \`$which\`; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          read -r run_id trial_id <<< "$picked"
          branch="aiops/verified-${run_id}"
          echo "run $run_id, trial $trial_id, open_pr=$open"
          { echo "found=true"; echo "run_id=$run_id"; echo "trial_id=$trial_id"; echo "open=$open"; echo "branch=$branch"; } >> "$GITHUB_OUTPUT"

      - name: Apply the verified patch
        if: steps.pick.outputs.found == 'true'
        id: apply
        env:
          TRIAL_ID: ${{ steps.pick.outputs.trial_id }}
        run: |
          mkdir -p .work
          ./target/release/aiops --json apply "$TRIAL_ID" --body-file .work/pr-body.md > .work/applied.json
          python3 -c 'import json; a = json.load(open(".work/applied.json")); print(a["title"])' > .work/pr-title.txt
          echo "title=$(cat .work/pr-title.txt)" >> "$GITHUB_OUTPUT"
          echo "title: $(cat .work/pr-title.txt)"
          cat .work/pr-body.md
          git diff --stat
          git diff > .work/verified.patch
          { echo "## $(cat .work/pr-title.txt)"; echo; cat .work/pr-body.md; echo; echo '```diff'; cat .work/verified.patch; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the patched service
        if: steps.pick.outputs.found == 'true'
        run: cargo build -q --release --locked --manifest-path fixtures/orders-api/Cargo.toml

      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.found == 'true'
        with:
          name: verified-pr
          path: .work
          include-hidden-files: true

      - name: Open the pull request
        if: steps.pick.outputs.found == 'true' && steps.pick.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          TITLE: ${{ steps.apply.outputs.title }}
          RUN_ID: ${{ steps.pick.outputs.run_id }}
        run: |
          base="$GITHUB_REF_NAME"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "Branch $BRANCH already exists; this run was already turned into a pull request." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add fixtures
          git commit -q -m "$TITLE" -m "Verified on the deployment: $AIOPS_URL/runs/$RUN_ID"
          git push -u origin "$BRANCH"
          if url=$(gh pr create --base "$base" --head "$BRANCH" --title "$TITLE" --body-file .work/pr-body.md); then
            echo "Pull request: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The branch was pushed but the pull request could not be opened (allow GitHub Actions to create pull requests in the repository settings)."
            echo "Open it here: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$base...$BRANCH?expand=1" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
