name: Harness suite

# Two jobs, both inside the runner image (no network):
# - suite: every hand-written candidate in scenarios/n-plus-one/candidates/suite.json, then those of
#   the vulnerability-fix scenario (scenarios/sqli-search); fails when a verdict or its deciding
#   reason falls outside the expected set.
# - mutation: rule-generated mutants of the service through the correctness checks only; reports
#   how many each check catches and lists the survivors.
on:
  workflow_dispatch:
  push:
    paths:
      - scenarios/**
      - crates/aiops-core/**
      - apps/aiops-runner/**
      - fixtures/**
      - deploy/Dockerfile.runner
      - scripts/harness-suite.sh
      - scripts/mutation-test.py
      - .github/workflows/harness-suite.yml

concurrency:
  group: harness-suite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the runner image
        run: docker build -f deploy/Dockerfile.runner -t aiops-runner:suite .
      - name: Run the suite
        env:
          RUNNER_IMAGE: aiops-runner:suite
        run: |
          status=0
          scripts/harness-suite.sh || status=$?
          cat .work/harness-suite/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - name: Run the vulnerability-fix suite
        if: always()
        env:
          RUNNER_IMAGE: aiops-runner:suite
          SCENARIO: sqli-search
        run: |
          status=0
          scripts/harness-suite.sh || status=$?
          { echo; echo "### Vulnerability fix (sqli-search)"; cat .work/harness-suite-sqli-search/summary.md; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-suite
          path: |
            .work/harness-suite
            .work/harness-suite-sqli-search
          if-no-files-found: ignore
          include-hidden-files: true

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the runner image
        run: docker build -f deploy/Dockerfile.runner -t aiops-runner:suite .
      - name: Run the mutants
        run: |
          status=0
          python3 scripts/mutation-test.py --runner-image aiops-runner:suite || status=$?
          cat .work/mutation/summary.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation
          path: .work/mutation
          if-no-files-found: ignore
          include-hidden-files: true
