[package]
name = "aiops-cli"
description = "Command line and MCP server for the experiment engineer: start runs, wait for verdicts, read results."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "aiops"
path = "src/main.rs"

[dependencies]
aiops-core = { path = "../../crates/aiops-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
clap.workspace = true
