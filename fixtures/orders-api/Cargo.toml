[package]
name = "orders-api"
version = "0.1.0"
edition = "2021"
publish = false
description = "Demo order-list API with a deliberate N+1 query pattern. This is the experiment target."

# Standalone workspace: the runner copies this directory elsewhere and builds it on its own.
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Fixed by the scenario contract. Cargo.* files are outside the editable paths.
[profile.release]
incremental = true
codegen-units = 16
